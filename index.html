<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
:root{
  --bg:#eef2f7;--panel:#ffffff;--text:#111827;--muted:#6b7280;
  --border:#e5e7eb;--user:#2563eb;--bot:#f3f4f6;--input:#f9fafb;
}
body.dark{
  --bg:#0b1020;--panel:#111827;--text:#f9fafb;--muted:#9ca3af;
  --border:#263244;--user:#3b82f6;--bot:#1f2937;--input:#172033;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;justify-content:center;align-items:center;padding:18px;
}
.chat{
  width:min(760px,100%);height:min(780px,94vh);background:var(--panel);
  border:1px solid var(--border);border-radius:24px;overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.14);display:flex;flex-direction:column;
}
.header{
  display:flex;align-items:center;justify-content:space-between;padding:17px 20px;
  border-bottom:1px solid var(--border);background:var(--panel);
}
.brand{display:flex;align-items:center;gap:12px}
.avatar{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:var(--user);color:white;font-size:21px;
}
.title{font-weight:750;font-size:16px}.status{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--border);border-radius:11px;
  background:transparent;color:var(--text);cursor:pointer;font-size:16px;
}
.icon-btn:hover{background:var(--bot)}
#messages{
  flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;
  gap:14px;scroll-behavior:smooth;
}
.row{display:flex;gap:9px;align-items:flex-end}.row.user{justify-content:flex-end}
.msg{
  max-width:min(78%,560px);padding:12px 15px;border-radius:18px;
  line-height:1.5;font-size:14px;white-space:pre-wrap;word-wrap:break-word;
}
.msg.bot{background:var(--bot);border-bottom-left-radius:5px}
.msg.user{background:var(--user);color:white;border-bottom-right-radius:5px}
.time{font-size:10px;color:var(--muted);margin:0 4px 3px}
.typing{
  display:flex;gap:4px;padding:12px 15px;background:var(--bot);
  border-radius:18px;border-bottom-left-radius:5px;width:max-content;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.composer{padding:14px 18px 18px;border-top:1px solid var(--border);background:var(--panel)}
.form{
  display:flex;align-items:center;gap:9px;padding:7px 7px 7px 14px;
  border:1px solid var(--border);border-radius:17px;background:var(--input);
}
input{
  flex:1;border:0;outline:0;background:transparent;color:var(--text);
  font-size:14px;min-width:0;padding:8px 0;
}
.send{
  width:42px;height:42px;border:0;border-radius:13px;background:var(--user);
  color:white;cursor:pointer;font-size:17px;display:grid;place-items:center;
}
.send:disabled{opacity:.55;cursor:wait}
.hint{text-align:center;font-size:10px;color:var(--muted);margin-top:9px}
@media(max-width:600px){
  body{padding:0}.chat{height:100vh;border-radius:0;border:0}
  #messages{padding:18px}.msg{max-width:86%}
}
</style>
</head>
<body>
<div class="chat">
  <header class="header">
    <div class="brand">
      <div class="avatar">🤖</div>
      <div>
        <div class="title">AI Assistant</div>
        <div class="status">Powered by your Make automation</div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="theme" title="Toggle theme">🌙</button>
      <button class="icon-btn" id="clear" title="Clear chat">🗑</button>
    </div>
  </header>

  <main id="messages">
    <div class="row">
      <div class="msg bot">Hi! 👋 I'm your AI assistant. What would you like to talk about?</div>
    </div>
  </main>

  <div class="composer">
    <form class="form" id="chatForm">
      <input id="message" placeholder="Message your AI assistant..." autocomplete="off" required>
      <button class="send" id="send" type="submit" title="Send">➤</button>
    </form>
    <div class="hint">Press Enter to send</div>
  </div>
</div>

<script>
const WEBHOOK_URL="https://https://shy-frost-9af6.hebronpeter376.workers.dev//77t8acbwx9psnf4zpi8m9fdcnjanl1tv";
const messages=document.getElementById("messages");
const input=document.getElementById("message");
const send=document.getElementById("send");

function time(){
  return new Intl.DateTimeFormat([], {hour:"numeric",minute:"2-digit"}).format(new Date());
}
function addMessage(text, type){
  const row=document.createElement("div");
  row.className="row "+type;
  const msg=document.createElement("div");
  msg.className="msg "+type;
  msg.textContent=text;
  const stamp=document.createElement("div");
  stamp.className="time";
  stamp.textContent=time();
  if(type==="user"){row.append(stamp,msg)}else{row.append(msg,stamp)}
  messages.appendChild(row);
  messages.scrollTop=messages.scrollHeight;
}
function showTyping(){
  const row=document.createElement("div");
  row.className="row";row.id="typingRow";
  row.innerHTML='<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  messages.appendChild(row);messages.scrollTop=messages.scrollHeight;
}
function hideTyping(){document.getElementById("typingRow")?.remove()}

document.getElementById("chatForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=input.value.trim();if(!text)return;
  addMessage(text,"user");input.value="";send.disabled=true;showTyping();
  try{
    const res=await fetch(WEBHOOK_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });
    const reply=await res.text();
    if(!res.ok)throw new Error("HTTP "+res.status);
   hideTyping();addMessage(reply||"I received your message, but no reply was returned.","ai");
  }catch(err){
    hideTyping();addMessage("I couldn't reach the automation. Make sure your Make scenario is turned on.","bot");
  }finally{send.disabled=false;input.focus()}
});

document.getElementById("theme").addEventListener("click",()=>{
  document.body.classList.toggle("dark");
  document.getElementById("theme").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
});
document.getElementById("clear").addEventListener("click",()=>{
  messages.innerHTML='<div class="row"><div class="msg bot">Chat cleared. How can I help?</div></div>';
});
</script>
</body>
</html>
